{% extends "base.html" %}
{% block title %}Error {{ status_code }} · {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md py-16 text-center">
  <p class="text-6xl font-extrabold text-indigo-600">{{ status_code }}</p>
  <h1 class="mt-3 text-xl font-semibold">{{ detail or "Something went wrong" }}</h1>
  <a href="/" class="btn-primary mt-6">Back home</a>
</div>
{% endblock %}
