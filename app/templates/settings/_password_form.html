<form id="password-form" hx-post="/settings/password" hx-target="#password-form" hx-swap="outerHTML" method="post" action="/settings/password" class="grid gap-3 sm:grid-cols-2">
  {% if message %}<p class="alert-ok sm:col-span-2">{{ message }}</p>{% endif %}
  {% if error %}<p class="alert-error sm:col-span-2">{{ error }}</p>{% endif %}
  {% if user.password_hash %}
    <input class="input" name="current_password" type="password" placeholder="Current password" autocomplete="current-password" required>
  {% endif %}
  <input class="input" name="new_password" type="password" placeholder="New password (min. 8)" autocomplete="new-password" minlength="8" required>
  <button class="btn-secondary sm:col-span-2 sm:w-auto" type="submit">Save password</button>
</form>
